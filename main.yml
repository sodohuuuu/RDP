name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                           -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                           -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                           -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP User
        run: |
          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = ([char[]](33..47) + [char[]](58..64) + [char[]](91..96) + [char[]](123..126))
          }
          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password = -join ($rawPassword | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          echo "RDP_CREDS=User: RDP | Password: $password" >> $env:GITHUB_ENV

      - name: Install Apps
        run: |
          winget install Telegram.TelegramDesktop -e --silent --accept-package-agreements --accept-source-agreements
          winget install 9NKSQGP7F2NH -e --silent --accept-package-agreements --accept-source-agreements

      - name: Restore Previous Session Data
        run: |
          $token = "${{ secrets.GH_DATA_TOKEN }}"
          git clone https://x-access-token:$token@github.com/${{ github.repository_owner }}/rdp-data.git C:\rdp-backup
          
          $paths = @{
            "tg"      = @{ src = "C:\rdp-backup\tg";      dst = "C:\Users\RDP\AppData\Roaming\Telegram Desktop\tdata" }
            "wp"      = @{ src = "C:\rdp-backup\wp";      dst = "C:\Users\RDP\AppData\Local\Packages\5319275A.WhatsAppDesktop_cv1g1gvanyjgm\LocalCache\Roaming\WhatsApp" }
            "desktop" = @{ src = "C:\rdp-backup\desktop"; dst = "C:\Users\RDP\Desktop" }
          }
          
          foreach ($key in $paths.Keys) {
            $src = $paths[$key].src
            $dst = $paths[$key].dst
            if (Test-Path $src) {
              New-Item -Path $dst -ItemType Directory -Force
              robocopy $src $dst /E /NFL /NDL
              Write-Host "Restored: $key"
            } else {
              Write-Host "No backup found for: $key"
            }
          }

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          if (-not $tsIP) { Write-Error "Tailscale IP not assigned."; exit 1 }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Verify RDP
        run: |
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) { Write-Error "RDP port failed"; exit 1 }

      - name: Maintain Connection + Auto Save
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address  : $env:TAILSCALE_IP"
          Write-Host "Username : RDP"
          Write-Host "Password : $env:RDP_CREDS"
          Write-Host "==================`n"

          while ($true) {
            Write-Host "[$(Get-Date)] Syncing..."
            
            $paths = @{
              "tg"      = @{ src = "C:\Users\RDP\AppData\Roaming\Telegram Desktop\tdata"; dst = "C:\rdp-backup\tg" }
              "wp"      = @{ src = "C:\Users\RDP\AppData\Local\Packages\5319275A.WhatsAppDesktop_cv1g1gvanyjgm\LocalCache\Roaming\WhatsApp"; dst = "C:\rdp-backup\wp" }
              "desktop" = @{ src = "C:\Users\RDP\Desktop"; dst = "C:\rdp-backup\desktop" }
            }
            
            foreach ($key in $paths.Keys) {
              $src = $paths[$key].src
              $dst = $paths[$key].dst
              if (Test-Path $src) {
                New-Item -Path $dst -ItemType Directory -Force
                robocopy $src $dst /E /NFL /NDL
              }
            }
            
            cd C:\rdp-backup
            git config user.email "rdp@save.com"
            git config user.name "RDP"
            git add .
            git commit -m "autosave $(Get-Date -Format 'HH:mm')" --allow-empty
            git push origin main
            
            Start-Sleep -Seconds 300
          }

      - name: Final Save on Exit
        if: always()
        run: |
          $paths = @{
            "tg"      = @{ src = "C:\Users\RDP\AppData\Roaming\Telegram Desktop\tdata"; dst = "C:\rdp-backup\tg" }
            "wp"      = @{ src = "C:\Users\RDP\AppData\Local\Packages\5319275A.WhatsAppDesktop_cv1g1gvanyjgm\LocalCache\Roaming\WhatsApp"; dst = "C:\rdp-backup\wp" }
            "desktop" = @{ src = "C:\Users\RDP\Desktop"; dst = "C:\rdp-backup\desktop" }
          }
          
          foreach ($key in $paths.Keys) {
            $src = $paths[$key].src
            $dst = $paths[$key].dst
            if (Test-Path $src) {
              New-Item -Path $dst -ItemType Directory -Force
              robocopy $src $dst /E /NFL /NDL
            }
          }
          
          cd C:\rdp-backup
          git config user.email "rdp@save.com"
          git config user.name "RDP"
          git add .
          git commit -m "final save $(Get-Date)" --allow-empty
          git push origin main
          Write-Host "All data saved!"
